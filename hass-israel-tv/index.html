<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Israel TV — צפייה ישירה</title>
  <meta name="description" content="צפייה ישירה בערוצי ישראל — ספורט 1–4, קשת 12, ערוץ 14 ועוד." />
  <meta name="theme-color" content="#070b12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Israel TV" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>
    try {
      const session = JSON.parse(localStorage.getItem("israel-tv-auth") || "null");
      const end = session && (session.licenseExp || session.exp);
      if (session?.role && end && end > Date.now() / 1000) {
        document.documentElement.dataset.session = "1";
        document.documentElement.dataset.admin = session.role === "admin" ? "1" : "0";
      }
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --bg-soft: #0e1520;
      --card: #151d2b;
      --card-hover: #1d283a;
      --line: #243044;
      --text: #eef3f8;
      --muted: #93a0b3;
      --accent: #3d8bff;
      --accent-2: #f5c451;
      --live: #ff4d4d;
      --ok: #3dd68c;
      --radius: 16px;
      --header: 64px;
      --video-max-h: min(32vh, 360px);
      --video-ar: 1.777778;
    }

    * { box-sizing: border-box; }
    html, body, #app { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "Segoe UI", "Rubik", "Arial Hebrew", Arial, sans-serif;
    }
    html[data-session="1"], html[data-session="1"] body { overflow: hidden; }

    header.top {
      position: relative;
      flex-shrink: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: var(--header);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      background: rgba(7, 11, 18, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .brand {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: start;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      cursor: pointer;
    }
    .brand img { width: 36px; height: 36px; border-radius: 10px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
    .brand span { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
    .expiry {
      appearance: none;
      font: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      background: rgba(61, 139, 255, 0.14);
      color: #cfe2ff;
      border: 1px solid #2d4f80;
      border-radius: 14px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
    }
    .expiry span { display: block; }
    .expiry:hover { filter: brightness(1.12); }
    .expiry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .expiry.warn { background: rgba(245, 196, 81, 0.14); color: #f5c451; border-color: #6d5a24; }
    .expiry.danger { background: rgba(255, 77, 77, 0.12); color: #ff8a8a; border-color: #6d2a2a; }
    .expiry[hidden] { display: none !important; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-inline-start: auto;
    }
    .header-actions .icon-btn svg { width: 20px; height: 20px; display: block; }
    .install { display: none !important; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .presets button {
      background: #243044 !important;
      padding: 8px 10px !important;
      font-size: 13px;
    }
    .install[hidden] { display: none !important; }
    #iosHint, .ios-hint { display: none !important; }

    .search {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: inherit;
      padding: 0 16px;
      font-size: 16px;
    }
    .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 16px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stage {
      flex: 0 0 auto;
      max-height: 40vh;
      background: var(--bg);
    }
    .stage[hidden] { display: none !important; }
    html.pip-on .theater {
      width: 1px;
      height: 1px;
      max-height: 1px;
      aspect-ratio: auto;
      margin: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }
    html.pip-on .theater video {
      width: 1px;
      height: 1px;
    }
    html.pip-on .now { display: none; }
    html.pip-on .stage { max-height: none; }
    .catalog {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .theater {
      position: relative;
      width: min(100%, calc(var(--video-max-h) * var(--video-ar)));
      max-height: var(--video-max-h);
      aspect-ratio: var(--video-ar);
      margin-inline: auto;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .theater video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .idle, .status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }
    .idle { background: radial-gradient(circle at 50% 20%, #1a2740 0%, #070b12 70%); }
    .idle strong { font-size: 22px; }
    .idle p, .status p { margin: 0; color: var(--muted); }
    .status { background: rgba(0, 0, 0, 0.45); }
    .status.hidden, .idle.hidden { display: none; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--live); box-shadow: 0 0 0 6px rgba(255, 77, 77, 0.15);
    }

    .now {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 8px 10px;
      background: var(--bg-soft);
      border-top: 1px solid var(--line);
    }
    .now-logo {
      height: 36px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      display: block;
    }
    .now-logo[hidden] { display: none !important; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 12px);
      z-index: 80;
      padding: 10px 16px;
      border-radius: 999px;
      background: #1c2738;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .actions { margin-inline-start: auto; display: flex; gap: 8px; }
    .actions button[hidden] { display: none !important; }
    .actions button, .actions a {
      border: 0;
      border-radius: 12px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      background: #243044;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .actions button.primary { background: var(--accent); color: #fff; }
    .actions button.casting { background: var(--accent); color: #fff; }
    .actions svg { width: 20px; height: 20px; display: block; }
    .cast-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: radial-gradient(circle at 50% 20%, #1a2740 0%, #070b12 70%);
      text-align: center;
      padding: 24px;
    }
    .cast-banner[hidden] { display: none !important; }
    .cast-banner strong { font-size: 20px; }
    .cast-banner p { margin: 0; color: var(--muted); }

    .section { margin-top: 12px; }
    .section[hidden] { display: none !important; }
    .section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 650;
    }

    .chips, .cats { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .cat {
      border: 1px solid var(--line);
      background: var(--card);
      color: inherit;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip:hover, .cat:hover, .card:hover { background: var(--card-hover); }
    .chip.active, .cat.active { background: var(--accent); border-color: transparent; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
    }
    .card {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: inherit;
      border-radius: var(--radius);
      padding: 12px 10px 14px;
      cursor: pointer;
      text-align: center;
      min-width: 0;
    }
    .card.active { outline: 2px solid var(--accent); }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 10px;
      border-radius: 16px; background: #0b1018;
      display: grid; place-items: center; overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .card .title { font-weight: 700; font-size: 14px; line-height: 1.3; }
    .card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    footer.credit {
      margin: 36px 16px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      direction: ltr;
    }
    footer.credit a { color: inherit; font-weight: 700; }

    html[data-session="1"] #gate { display: none !important; }
    html[data-session="1"] #app[hidden] { display: flex !important; }
    #app[hidden] { display: none !important; }
    #gate {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 32px;
    }
    #gate[hidden] { display: none !important; }
    .login {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 22px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .login h2 { margin: 0 0 6px; font-size: 22px; }
    .login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .login input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg-soft);
      color: inherit;
      padding: 0 14px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .login button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .login .err { color: #ff8a8a; font-size: 13px; min-height: 18px; margin: 0 0 8px; }
    .icon-btn {
      border: 0;
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: #243044;
      color: inherit;
      cursor: pointer;
    }
    .icon-btn[hidden] { display: none !important; }
    #licenseBtn { display: none !important; }
    html[data-admin="1"] #licenseBtn:not([hidden]) { display: grid !important; }
    dialog.sheet {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      color: inherit;
      width: min(460px, calc(100% - 24px));
      padding: 18px;
    }
    dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.55); }
    dialog.sheet h3 { margin: 0 0 10px; }
    dialog.sheet input, dialog.sheet textarea, dialog.sheet select {
      width: 100%;
      box-sizing: border-box;
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-soft);
      color: inherit;
      padding: 10px;
      font-size: 16px;
    }
    dialog.sheet .row { display: flex; gap: 8px; }
    dialog.sheet button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    dialog.sheet button.ghost { background: #243044; }
    dialog.sheet button[hidden] { display: none !important; }
    .key-box {
      position: relative;
      margin: 0 0 12px;
    }
    .key-box[hidden] { display: none !important; }
    dialog.sheet .key-box input {
      width: 100%;
      min-height: 48px;
      margin: 0;
      padding: 12px 48px 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0b1220;
      color: inherit;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 15px;
      letter-spacing: 0.05em;
      text-align: center;
      direction: ltr;
    }
    dialog.sheet .key-copy {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: #243044;
      color: inherit;
      display: grid;
      place-items: center;
    }
    dialog.sheet .key-copy svg { width: 18px; height: 18px; display: block; }
    dialog.sheet .key-copy .icon-check { display: none; }
    dialog.sheet .key-copy.copied { background: var(--ok); color: #062813; }
    dialog.sheet .key-copy.copied .icon-copy { display: none; }
    dialog.sheet .key-copy.copied .icon-check { display: block; }
    .license-card {
      width: min(400px, calc(100% - 24px));
      padding: 0;
      overflow: hidden;
    }
    .license-card .lic-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 22px 16px;
      background: linear-gradient(180deg, rgba(61, 139, 255, 0.18), transparent);
    }
    .license-card .lic-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 14px;
      background: rgba(61, 139, 255, 0.2);
      color: #9ec2ff;
      display: grid;
      place-items: center;
    }
    .license-card .lic-icon svg { width: 24px; height: 24px; display: block; }
    .license-card h3 { margin: 0; font-size: 18px; }
    .license-card .lic-sub {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .license-card .lic-body { padding: 4px 22px 22px; }
    .license-card .lic-meta {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }
    .license-card .lic-row[hidden] { display: none !important; }
    .license-card .lic-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .license-card .lic-row span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .license-card .lic-row strong {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      font-size: 14px;
      font-weight: 700;
      text-align: start;
      word-break: break-word;
    }
    .license-card .lic-row strong span + span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .license-card .lic-key { margin-bottom: 16px; }
    .license-card .lic-key[hidden] { display: none !important; }
    .license-card .lic-key > span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .license-card .lic-key .key-box { margin: 0; }
    .license-card .row { justify-content: flex-end; }

    @media (max-width: 720px) {
      header.top {
        flex-wrap: wrap;
        gap: 8px;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
      }
      .brand h1 { font-size: 16px; }
      .expiry { padding: 4px 8px; font-size: 10px; }
      .search { width: 100%; flex-basis: 100%; }
      .count { display: none; }
      main { padding: 10px 12px 0; }
      .theater {
        border-radius: 14px;
      }
      :root { --video-max-h: min(26vh, 220px); }
      .stage { max-height: 34vh; }
      .now { padding: 6px 8px; gap: 8px; }
      .now-logo { height: 28px; }
      .actions { width: auto; }
      .chips, .cats {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      .chip, .cat { flex: 0 0 auto; min-height: 40px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .logo { width: 52px; height: 52px; border-radius: 12px; }
      .card { padding: 10px 6px 12px; }
      .card .title { font-size: 13px; }
      .idle strong { font-size: 16px; }
    }
    @media (max-width: 1024px) {
      .install:not([hidden]) { display: grid !important; }
    }
  </style>
</head>
<body>
  <div id="gate">
    <form class="login" id="loginForm">
      <h2>כניסה</h2>
      <p>העתיקו את הרישיון מהלוח, בלי להקליד אותו מחדש</p>
      <p class="err" id="loginErr"></p>
      <input id="licenseInput" type="text" autocomplete="off" spellcheck="false" placeholder="רישיון" inputmode="text" />
      <button type="submit">כניסה</button>
    </form>
  </div>
  <div id="app" hidden>
  <header class="top">
    <button type="button" class="brand" id="homeBtn" title="מסך ראשי" aria-label="מסך ראשי">
      <img src="favicon.png" alt="" />
      <div>
        <h1>Israel TV</h1>
        <span>צפייה ישירה</span>
      </div>
    </button>
    <div class="header-actions">
      <button type="button" class="expiry" id="expiry" hidden title="הרישיון שלכם" aria-label="הרישיון שלכם"></button>
      <button type="button" class="icon-btn" id="licenseBtn" hidden title="יצירת רישיון" aria-label="יצירת רישיון">🔑</button>
      <button type="button" class="icon-btn install" id="installBtn" title="התקן אפליקציה" aria-label="התקן אפליקציה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 8v6"/><path d="M9 11h6"/></svg>
      </button>
      <button type="button" class="icon-btn" id="logoutBtn" title="יציאה" aria-label="יציאה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="m14 8 4 4-4 4"/><path d="M18 12H9"/></svg>
      </button>
    </div>
    <input class="search" id="q" type="search" placeholder="חיפוש: ספורט 4, קשת, 12, 14..." enterkeyhint="search" />
    <div class="count" id="count"></div>
  </header>

  <main>
    <div class="stage" id="stage" hidden>
    <section class="theater" id="theater">
      <video id="player" controls playsinline autoplay x-webkit-airplay="allow"></video>
      <div class="cast-banner" id="castBanner" hidden>
        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor" aria-hidden="true"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <strong>משודר בטלוויזיה</strong>
        <p id="castBannerName">בחרו ערוץ כדי לשלוח ל-Cast</p>
      </div>
      <div class="status hidden" id="status"><p></p></div>
    </section>

    <div class="now">
      <img class="now-logo" id="nowLogo" alt="" hidden />
      <div class="actions">
        <button type="button" class="primary" id="playBtn" title="נגן" aria-label="נגן">

    function androidChooserUrl(url) {
      const parsed = new URL(url, location.href);
      const fallback = encodeURIComponent(parsed.href);
      return `intent://${parsed.host}${parsed.pathname}${parsed.search}${parsed.hash}#Intent;scheme=${parsed.protocol.replace(":", "")};action=android.intent.action.VIEW;type=application/x-mpegURL;S.browser_fallback_url=${fallback};end`;
    }

    function setOpenButton(url) {

      if (isAndroid) {

      openBtn.href = url;

    function b64url(bytes) {
      let bin = "";
      const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function b64urlJson(obj) {
      return b64url(new TextEncoder().encode(JSON.stringify(obj)));
    }

    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function b64urlDecode(text) {
      const pad = text + "=".repeat((4 - (text.length % 4)) % 4);
      return new TextDecoder().decode(Uint8Array.from(atob(pad.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)));
    }

    async function hmacSha256(keyStr, dataStr) {
      const key = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(keyStr),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(dataStr));
      return b64url(sig);
    }

    function nowSec() {
      return Math.floor(Date.now() / 1000);
    }

    function hebrewCount(value, one, many) {
      return `${value} ${value === 1 ? one : many}`;
    }

    function formatRemaining(exp) {
      const sec = Math.max(0, exp - nowSec());
      if (sec <= 0) return "פג תוקף";
      const days = Math.floor(sec / 86400);
      const hours = Math.floor((sec % 86400) / 3600);
      const minutes = Math.floor((sec % 3600) / 60);
      if (days > 0) return `נותרו ${hebrewCount(days, "יום", "ימים")}`;
      if (hours > 0) {
        return minutes
          ? `נותרו ${hebrewCount(hours, "שעה", "שעות")} ו־${hebrewCount(minutes, "דקה", "דקות")}`
          : `נותרו ${hebrewCount(hours, "שעה", "שעות")}`;
      }
      return `נותרו ${hebrewCount(Math.max(1, minutes), "דקה", "דקות")}`;
    }

    function formatUntilDate(exp) {
      return new Date(exp * 1000).toLocaleDateString("he-IL", {
        day: "numeric",
        month: "numeric",
        year: "numeric",
      });
    }

    function formatUntil(exp) {
      return new Date(exp * 1000).toLocaleString("he-IL", {
        day: "numeric",
        month: "numeric",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function readSession() {
      try {
        const session = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
        if (!session?.role) return null;
        const end = session.licenseExp || session.exp;
        if (!end || end < nowSec()) return null;
        return session;
      } catch {
        return null;
      }
    }

    function writeSession(session) {
      localStorage.setItem(AUTH_KEY, JSON.stringify(session));
    }

    function clearSession() {
      localStorage.removeItem(AUTH_KEY);
    }

    async function createLicense(note, seconds) {
      const session = readSession() || {};
      const res = await fetch(PWF_CHECK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "create",
          admin: window.__adminPass || "",
          token: session.adminToken || "",
          note,
          seconds,
          amount: Number(document.getElementById("licAmount").value) || 1,
          unit: Number(document.getElementById("licUnit").value) || 86400,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!data?.success || !data.license_key) {
        throw new Error(data?.message || "לא הצלחנו ליצור רישיון");
      }
      return data;
    }

    function durationSeconds(key) {
      const type = String(key?.key_type || key?.type || "").toLowerCase();
      const amount = Number(key?.duration ?? key?.days_remaining);
      if (type === "lifetime") return 3650 * 86400;
      if (!Number.isFinite(amount) || amount <= 0) return 0;
      if (type === "hours" || type === "hour") return amount * 3600;
      if (type === "weeks" || type === "week") return amount * 7 * 86400;
      if (type === "months" || type === "month") return amount * 30 * 86400;
      if (type === "years" || type === "year") return amount * 365 * 86400;
      return amount * 86400;
    }

    function parsePwfExp(key) {
      if (key?.expires_at) {
        const stamp = Date.parse(key.expires_at);
        if (Number.isFinite(stamp)) return Math.floor(stamp / 1000);
      }
      const daysLeft = Number(key?.days_remaining);
      if (Number.isFinite(daysLeft) && daysLeft > 0) {
        return nowSec() + Math.round(daysLeft * 86400);
      }
      const fromType = durationSeconds(key);
      if (fromType > 0) return nowSec() + fromType;
      if (String(key?.key_type || "").toLowerCase() === "lifetime") {
        return nowSec() + 3650 * 86400;
      }
      return nowSec() + 30 * 86400;
    }

    function pwfErrorMessage(data) {
      const code = data?.error_code || "";
      if (code === "INVALID_KEY") return "הרישיון לא נמצא. העתיקו אותו מהלוח, בלי להקליד מחדש.";
      if (code === "TOO_MANY_ATTEMPTS") return "יותר מדי ניסיונות כושלים. המתינו כ־15 דקות ונסו שוב.";
      if (code === "EXPIRED") return "פג תוקף הרישיון";
      if (code === "BANNED") return "הרישיון נחסם";
      if (code === "PAUSED") return "הרישיון מושהה";
      if (code === "NETWORK") return "אין חיבור לשרת האימות. בדקו את הרשת ונסו שוב.";
      const detail = String(data?.detail || data?.message || "");
      if (detail.includes("CSRF") || detail.includes("Failed to fetch") || detail.includes("NetworkError")) {
        return "אין חיבור לשרת האימות. רעננו את העמוד ונסו שוב.";
      }
      if (detail.toLowerCase().includes("app secret")) return "אימות הרישיון נכשל";
      return detail || "רישיון לא תקין או שפג תוקפו";
    }

    function stripLicenseSpaces(value) {
      return String(value || "").replace(/[\s\u00a0\u2000-\u200f\u202a-\u202e\u2060]+/g, "");
    }

    function normalizeLicenseKey(value) {
      return stripLicenseSpaces(value).toUpperCase();
    }

    const licenseInput = document.getElementById("licenseInput");
    function lockLicenseInput() {
      const cleaned = stripLicenseSpaces(licenseInput.value);
      if (licenseInput.value !== cleaned) licenseInput.value = cleaned;
    }
    licenseInput.addEventListener("input", lockLicenseInput);
    licenseInput.addEventListener("blur", lockLicenseInput);
    licenseInput.addEventListener("paste", (event) => {
      event.preventDefault();
      const pasted = stripLicenseSpaces(event.clipboardData?.getData("text") || "");
      licenseInput.value = pasted;
    });

    async function verifyPwfLicense(code, email) {
      const res = await fetch(PWF_CHECK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ license_key: code, email }),
      });
      const data = await res.json().catch(() => ({}));
      const status = String(data?.key?.status || "").toLowerCase();
      const usable = data?.success && (data.valid === true || status === "unused" || status === "active");
      return usable ? { ok: true, key: data.key || {} } : { ok: false, data };
    }

    async function verifyLicense(code) {
      const parts = String(code || "").trim().split(".");
      if (parts[0] !== "ITV1" || parts.length !== 3) return null;
      const expected = await hmacSha256(LICENSE_SECRET, parts[1]);
      if (expected !== parts[2]) return null;
      let payload;
      try {
        payload = JSON.parse(b64urlDecode(parts[1]));
      } catch {
        return null;
      }
      if (!payload?.exp || payload.exp < Date.now() / 1000) return null;
      return payload;
    }

    function refreshExpiry(session) {
      const el = document.getElementById("expiry");
      if (session.role === "admin") {
        el.hidden = false;
        el.className = "expiry";
        el.textContent = "מנהל · ללא הגבלת זמן";
        return;
      }
      const exp = session.licenseExp || session.exp;
      const left = exp - nowSec();
      if (left <= 0) {
        lockApp();
        return;
      }
      el.hidden = false;
      el.className = `expiry${left <= 3600 ? " danger" : left <= 86400 ? " warn" : ""}`;
      el.innerHTML = `<span>${formatRemaining(exp)}</span><span>עד ${formatUntilDate(exp)}</span>`;
    }

    function openLicenseView() {
      const session = readSession();
      if (!session) return;
      const license = session.license || session.note || "";
      const emailRow = document.getElementById("viewEmailRow");
      if (session.email) {
        emailRow.hidden = false;
        document.getElementById("viewEmail").textContent = session.email;
      } else {
        emailRow.hidden = true;
      }
      const exp = session.licenseExp || session.exp;
      document.getElementById("viewUntil").innerHTML = session.role === "admin"
        ? "מנהל · ללא הגבלת זמן"
        : `<span>${formatRemaining(exp)}</span><span>עד ${formatUntil(exp)}</span>`;
      const wrap = document.getElementById("viewLicenseWrap");
      document.getElementById("viewLicense").value = license;
      wrap.hidden = !license;
      document.getElementById("licenseViewDlg").showModal();
    }

    function unlockApp(session) {
      writeSession(session);
      document.documentElement.dataset.session = "1";
      document.documentElement.dataset.admin = session.role === "admin" ? "1" : "0";
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;
      document.getElementById("licenseBtn").hidden = session.role !== "admin";
      refreshExpiry(session);
      if (!window.__expiryClock) {
        window.__expiryClock = setInterval(() => {
          const current = readSession();
          if (!current) {
            lockApp();
            return;
          }
          refreshExpiry(current);
        }, 30000);
      }
      bootPlayer();
    }

    function lockApp() {
      document.documentElement.dataset.session = "0";
      document.documentElement.dataset.admin = "0";
      clearSession();
      if (hls) {
        hls.destroy();
        hls = undefined;
      }
      location.hash = "";
      location.reload();
    }

    async function generateBroadpeakJwt() {
      const header = { alg: "HS256", kid: "broadpeak", typ: "JWT" };
      const payload = { cti: DEFAULT_CTI, exp: 2000000000.0 };
      const h = b64urlJson(header);
      const p = b64urlJson(payload);
      return `${h}.${p}.${await hmacSha256(BROADPEAK_KEY, `${h}.${p}`)}`;
    }

    async function buildCatUrl(path) {
      const jwt = await generateBroadpeakJwt();
      return `https://${CDN}/_cat/${jwt}/${path.replace(/^\/+/, "")}`;
    }

    function setStatus(text) {
      if (!text) {
        status.classList.add("hidden");
        status.querySelector("p").textContent = "";
        return;
      }
      status.classList.remove("hidden");
      status.querySelector("p").textContent = text;
    }

    function matches(channel, query) {
      if (!query) return true;
      if (ALIASES[query] === channel.id) return true;
      const hay = `${channel.id} ${channel.name} ${channel.nameEn} ${channel.label}`.toLowerCase();
      return hay.includes(query);
    }

    function loadRecent() {
      try {
        const ids = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
        return Array.isArray(ids) ? ids.filter((id) => CHANNELS.some((channel) => channel.id === id)) : [];
      } catch {
        return [];
      }
    }

    function saveRecent(id) {
      const ids = loadRecent().filter((item) => item !== id);
      ids.unshift(id);
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids.slice(0, RECENT_LIMIT)));
    }

    function visibleChannels() {
      const query = document.getElementById("q").value.trim().toLowerCase();
      return CHANNELS.filter((channel) => {
        if (category !== "all" && channel.category !== category) return false;
        return matches(channel, query);
      });
    }

    function render() {
      const query = document.getElementById("q").value.trim().toLowerCase();
      recentEl.innerHTML = "";
      const recent = loadRecent()
        .map((id) => CHANNELS.find((item) => item.id === id))
        .filter((channel) => channel && matches(channel, query));
      recentSection.hidden = recent.length === 0;
      for (const channel of recent) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chip${current?.id === channel.id ? " active" : ""}`;
        btn.textContent = channel.name;
        btn.addEventListener("click", () => playChannel(channel));
        recentEl.append(btn);
      }

      catsEl.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = `cat${category === "all" ? " active" : ""}`;
      allBtn.textContent = "הכל";
      allBtn.addEventListener("click", () => { category = "all"; render(); });
      catsEl.append(allBtn);
      for (const [id, label] of Object.entries(CATEGORY_LABELS)) {
        if (!CHANNELS.some((channel) => channel.category === id)) continue;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `cat${category === id ? " active" : ""}`;
        btn.textContent = label;
        btn.addEventListener("click", () => { category = id; render(); });
        catsEl.append(btn);
      }

      const list = visibleChannels();
      gridEl.innerHTML = "";
      for (const channel of list) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `card${current?.id === channel.id ? " active" : ""}`;
        card.innerHTML = `
          <div class="logo">${channel.logo ? `<img src="${channel.logo}" alt="">` : channel.name.slice(0, 2)}</div>
          <div class="title"></div>
          <div class="sub"></div>
        `;
        card.querySelector(".title").textContent = channel.name;
        card.querySelector(".sub").textContent = channel.nameEn;
        card.addEventListener("click", () => playChannel(channel));
        gridEl.append(card);
      }

      countEl.textContent = `${list.length} ערוצים`;
      gridTitle.textContent = query || category !== "all"
        ? `${list.length} ערוצים`
        : `כל הערוצים (${CHANNELS.length})`;
    }

    function syncVideoFrame() {
      const width = video.videoWidth;
      const height = video.videoHeight;
      if (width > 0 && height > 0) {
        theater.style.setProperty("--video-ar", String(width / height));
        return;
      }
      theater.style.removeProperty("--video-ar");
    }

    video.addEventListener("loadedmetadata", syncVideoFrame);
    video.addEventListener("loadeddata", syncVideoFrame);
    video.addEventListener("resize", syncVideoFrame);
    video.addEventListener("playing", () => setStatus(""));

    function startPlayback() {
      video.autoplay = true;
      video.playsInline = true;
      setStatus("");
      const tryPlay = (muted) => {
        video.muted = muted;
        return video.play().then(() => {
          if (muted) video.muted = false;
        });
      };
      return tryPlay(false).catch(() => tryPlay(true)).catch(() => {});
    }

    function attachHls(url) {
      if (hls) {
        hls.destroy();
        hls = undefined;
      }
      video.removeAttribute("src");
      if (video.canPlayType("application/vnd.apple.mpegurl") && !window.Hls?.isSupported()) {
        video.src = url;
        return startPlayback();
      }
      if (window.Hls?.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          startPlayback();
        });
        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data?.fatal) setStatus("השידור לא נטען. נסו ערוץ אחר או העתיקו את הקישור ל-VLC.");
        });
        return;
      }
      setStatus("הדפדפן לא תומך ב-HLS. העתיקו את הקישור ל-VLC.");
    }

    function setNowLogo(channel) {
      if (channel?.logo) {
        nowLogo.src = channel.logo;
        nowLogo.alt = channel.name || "";
        nowLogo.title = channel.name || "";
        nowLogo.hidden = false;
        return;
      }
      nowLogo.removeAttribute("src");
      nowLogo.alt = "";
      nowLogo.title = "";
      nowLogo.hidden = true;
    }

    function showStage(show) {
      stage.hidden = !show;
    }

    function goHome() {
      current = undefined;
      currentUrl = "";
      stopLocalPlayback();
      showStage(false);
      setNowLogo();
      setStatus("");
      setOpenButton("");
      document.getElementById("q").value = "";
      category = "all";
      history.replaceState(null, "", location.pathname + location.search);
      syncCastUi();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function stopLocalPlayback() {
      if (hls) {
        hls.destroy();
        hls = undefined;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
      theater.style.removeProperty("--video-ar");
    }

    function getCastContext() {
      try {
        return window.cast?.framework?.CastContext.getInstance() || null;
      } catch {
        return null;
      }
    }

    function getCastSession() {
      return getCastContext()?.getCurrentSession() || null;
    }

    function syncCastUi() {
      const session = getCastSession();
      const device = session?.getCastDevice()?.friendlyName;
      castBtn.classList.toggle("casting", Boolean(session));
      castBtn.title = session ? `מנתק Cast${device ? ` · ${device}` : ""}` : "Cast לטלוויזיה";
      if (session && current) {
        showStage(true);
        castBanner.hidden = false;
        castBannerName.textContent = device ? `${current.name} · ${device}` : current.name;
      } else {
        castBanner.hidden = true;
      }
    }

    async function loadCastMedia(url, channel) {
      const session = getCastSession();
      if (!session || !url || !window.chrome?.cast?.media) return false;
      const mediaInfo = new chrome.cast.media.MediaInfo(url, "application/x-mpegurl");
      mediaInfo.streamType = chrome.cast.media.StreamType.LIVE;
      if (chrome.cast.media.HlsSegmentFormat) {
        mediaInfo.hlsSegmentFormat = chrome.cast.media.HlsSegmentFormat.TS;
      }
      if (chrome.cast.media.HlsVideoSegmentFormat) {
        mediaInfo.hlsVideoSegmentFormat = chrome.cast.media.HlsVideoSegmentFormat.MPEG2_TS;
      }
      const meta = new chrome.cast.media.GenericMediaMetadata();
      meta.title = channel?.name || "Israel TV";
      meta.subtitle = channel?.nameEn || "";
      if (channel?.logo) meta.images = [{ url: new URL(channel.logo, location.href).href }];
      mediaInfo.metadata = meta;
      const request = new chrome.cast.media.LoadRequest(mediaInfo);
      request.autoplay = true;
      await session.loadMedia(request);
      return true;
    }

    function initCastApi() {
      if (!window.cast?.framework || !window.chrome?.cast) return;
      const context = cast.framework.CastContext.getInstance();
      context.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
        resumeSavedSession: true,
      });
      context.addEventListener(
        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
        async (event) => {
          syncCastUi();
          const started = event.sessionState === cast.framework.SessionState.SESSION_STARTED
            || event.sessionState === cast.framework.SessionState.SESSION_RESUMED;
          if (started && currentUrl) {
            try {
              stopLocalPlayback();
              await loadCastMedia(currentUrl, current);
              setStatus("");
              syncCastUi();
            } catch {
              setStatus("ה-Cast התחבר, אבל השידור לא נטען בטלוויזיה.");
            }
          }
          if (event.sessionState === cast.framework.SessionState.SESSION_ENDED && currentUrl) {
            attachHls(currentUrl);
          }
        }
      );
      syncCastUi();
    }

    async function startCast() {
      if (video.webkitShowPlaybackTargetPicker) {
        video.webkitShowPlaybackTargetPicker();
        return;
      }
      if (video.remote?.prompt) {
        try {
          await video.remote.prompt();
          return;
        } catch {
          /* fall through to Cast SDK */
        }
      }
      const context = getCastContext();
      if (!context) {
        setStatus("Cast זמין בכרום או באנדרואיד. באייפון לחצו AirPlay בנגן.");
        return;
      }
      const existing = context.getCurrentSession();
      if (existing) {
        await context.endCurrentSession(true);
        syncCastUi();
        return;
      }
      await context.requestSession();
      if (!currentUrl) {
        const lastId = current?.id || loadRecent()[0] || "yes4";
        const fallback = CHANNELS.find((channel) => channel.id === lastId);
        if (fallback) await playChannel(fallback);
        return;
      }
      stopLocalPlayback();
      await loadCastMedia(currentUrl, current);
      setStatus("");
      syncCastUi();
    }

    function setMediaSession(channel) {
      if (!navigator.mediaSession || !channel) return;
      const logo = channel.logo ? new URL(channel.logo, location.href).href : "";
      navigator.mediaSession.metadata = new MediaMetadata({
        title: channel.name || "Israel TV",
        artist: "Israel TV",
        artwork: logo ? [{ src: logo, sizes: "192x192", type: "image/png" }] : [],
      });
      navigator.mediaSession.playbackState = "playing";
      navigator.mediaSession.setActionHandler("play", () => startPlayback());
      navigator.mediaSession.setActionHandler("pause", () => video.pause());
    }

    function pipAvailable() {
      return Boolean(document.pictureInPictureEnabled || video.webkitSupportsPresentationMode);
    }

    function setPipMode(on) {
      document.documentElement.classList.toggle("pip-on", on);
      pipBtn.classList.toggle("casting", on);
    }

    function isPipOpen() {
      return Boolean(document.pictureInPictureElement)
        || video.webkitPresentationMode === "picture-in-picture";
    }

    async function enterPip() {
      if (isPipOpen()) return;
      if (video.paused) await startPlayback();
      if (video.webkitSetPresentationMode) {
        video.webkitSetPresentationMode("picture-in-picture");
        return;
      }
      if (!document.pictureInPictureEnabled) {
        throw new Error("pip-unavailable");
      }
      await video.requestPictureInPicture();
    }

    async function togglePip() {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
        return;
      }
      if (video.webkitPresentationMode === "picture-in-picture") {
        video.webkitSetPresentationMode("inline");
        return;
      }
      await enterPip();
    }

    async function playChannel(channel) {
      current = channel;
      saveRecent(channel.id);
      showStage(true);
      setNowLogo(channel);
      setMediaSession(channel);
      setStatus("");
      history.replaceState(null, "", `#${channel.id}`);
      render();
      try {
        currentUrl = await buildCatUrl(channel.path);
        setOpenButton(currentUrl);
        if (getCastSession()) {
          stopLocalPlayback();
          await loadCastMedia(currentUrl, channel);
          setStatus("");
          syncCastUi();
          return;
        }
        attachHls(currentUrl);
      } catch (error) {
        setStatus("לא ניתן לחתום את הקישור בדפדפן הזה.");
      }
    }

    document.getElementById("homeBtn").addEventListener("click", goHome);
    document.getElementById("q").addEventListener("input", render);
    castBtn.addEventListener("click", async () => {
      try {
        await startCast();
      } catch (error) {
        if (String(error?.message || error).includes("cancel")) return;
        setStatus("לא נבחר מכשיר Cast. בדקו שהטלוויזיה על אותה רשת.");
      }
    });
    window.addEventListener("cast-api", (event) => {
      if (event.detail) initCastApi();
    });
    if (window.__castReady) initCastApi();

    pipBtn.hidden = false;
    pipBtn.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (!current) {
        showToast("בחרו ערוץ קודם");
        return;
      }
      try {
        await togglePip();
      } catch {
        showToast("לא ניתן לפתוח חלונית");
      }
    });
    video.addEventListener("enterpictureinpicture", () => setPipMode(true));
    video.addEventListener("leavepictureinpicture", () => {
      setPipMode(false);
      if (current) showStage(true);
    });
    video.addEventListener("webkitpresentationmodechanged", () => {
      setPipMode(video.webkitPresentationMode === "picture-in-picture");
    });

    let keepPlaying = false;
    video.addEventListener("play", () => {
      keepPlaying = true;
      if (navigator.mediaSession) navigator.mediaSession.playbackState = "playing";
    });
    video.addEventListener("pause", () => {
      if (!document.hidden && !isPipOpen()) keepPlaying = false;
      if (navigator.mediaSession && !keepPlaying) navigator.mediaSession.playbackState = "paused";
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden || !keepPlaying || !current) return;
      video.play().catch(() => {});
    });

    const unmuteVideo = () => {
      if (!video.paused) video.muted = false;
    };
    window.addEventListener("pointerdown", unmuteVideo);
    window.addEventListener("keydown", unmuteVideo);

    document.getElementById("playBtn").addEventListener("click", () => {
      if (!current) {
        const lastId = loadRecent()[0] || "yes4";
        const fallback = CHANNELS.find((channel) => channel.id === lastId);
        if (fallback) playChannel(fallback);
        return;
      }
      startPlayback();
    });
    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.classList.remove("show"), 1800);
    }

    async function copyStreamUrl() {
      if (!currentUrl) {
        showToast("בחרו ערוץ קודם");
        return;
      }
      await navigator.clipboard.writeText(currentUrl);
      showToast("הקישור הועתק");
    }

    let openHold;
    let openCopied = false;
    const clearOpenHold = () => clearTimeout(openHold);
    openBtn.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      openCopied = false;
      clearOpenHold();
      openHold = setTimeout(() => {
        openCopied = true;
        copyStreamUrl();
      }, 500);
    });
    openBtn.addEventListener("pointerup", clearOpenHold);
    openBtn.addEventListener("pointerleave", clearOpenHold);
    openBtn.addEventListener("pointercancel", clearOpenHold);
    openBtn.addEventListener("contextmenu", (event) => event.preventDefault());
    openBtn.addEventListener("click", (event) => {
      if (openCopied) {
        event.preventDefault();
        openCopied = false;
        return;
      }
      if (!currentUrl) {
        event.preventDefault();
        showToast("בחרו ערוץ קודם");
      }
    });

    let playerReady = false;
    function bootPlayer() {
      if (playerReady) return;
      playerReady = true;
      render();
      const startId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      const start = CHANNELS.find((channel) => channel.id === startId)
        || (startId && CHANNELS.find((channel) => ALIASES[startId] === channel.id));
      if (start) playChannel(start);
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = stripLicenseSpaces(document.getElementById("licenseInput").value);
      const err = document.getElementById("loginErr");
      err.textContent = "";
      if (!value) {
        err.textContent = "הזינו רישיון";
        return;
      }
      if (await sha256Hex(value) === ADMIN_HASH) {
        window.__adminPass = value;
        let adminToken = "";
        try {
          const boot = await fetch(PWF_CHECK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "admin-session", admin: value }),
          });
          const data = await boot.json().catch(() => ({}));
          if (data?.success && data.token) adminToken = data.token;
        } catch {}
        unlockApp({ role: "admin", exp: nowSec() + 3650 * 86400, adminToken });
        return;
      }
      let pwf;
      try {
        pwf = await verifyPwfLicense(normalizeLicenseKey(value), "");
      } catch (error) {
        pwf = { ok: false, data: { error_code: "NETWORK", message: String(error?.message || error) } };
      }
      const licenseKey = normalizeLicenseKey(value);
      if (pwf.ok) {
        const exp = parsePwfExp(pwf.key);
        unlockApp({ role: "user", exp, licenseExp: exp, license: licenseKey, note: licenseKey });
        return;
      }
      const license = await verifyLicense(licenseKey);
      if (!license) {
        err.textContent = pwfErrorMessage(pwf.data);
        return;
      }
      unlockApp({ role: "user", exp: license.exp, licenseExp: license.exp, license: licenseKey, note: license.n });
    });
    document.getElementById("expiry").addEventListener("click", openLicenseView);
    document.getElementById("viewLicClose").addEventListener("click", () => {
      document.getElementById("licenseViewDlg").close();
    });
    function bindKeyCopy(button, input) {
      button.addEventListener("click", async () => {
        const value = input.value.trim();
        if (!value) return;
        await navigator.clipboard.writeText(value);
        button.classList.add("copied");
        window.setTimeout(() => button.classList.remove("copied"), 1200);
      });
    }
    bindKeyCopy(document.getElementById("viewLicCopy"), document.getElementById("viewLicense"));
    bindKeyCopy(document.getElementById("licCopy"), document.getElementById("licOut"));

    document.getElementById("logoutBtn").addEventListener("click", lockApp);
    document.getElementById("licenseBtn").addEventListener("click", () => {
      if (readSession()?.role !== "admin") return;
      document.getElementById("licenseDlg").showModal();
    });
    document.getElementById("licClose").addEventListener("click", () => {
      document.getElementById("licenseDlg").close();
    });
    function selectedLicenseSeconds() {
      const amount = Number(document.getElementById("licAmount").value) || 1;
      const unit = Number(document.getElementById("licUnit").value) || 86400;
      return Math.max(60, amount * unit);
    }

    document.querySelectorAll("#licenseDlg .presets button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sec = Number(btn.dataset.sec);
        if (sec >= 2592000 && sec % 2592000 === 0) {
          document.getElementById("licAmount").value = String(sec / 2592000);
          document.getElementById("licUnit").value = "2592000";
        } else if (sec >= 86400 && sec % 86400 === 0) {
          document.getElementById("licAmount").value = String(sec / 86400);
          document.getElementById("licUnit").value = "86400";
        } else {
          document.getElementById("licAmount").value = String(Math.max(1, Math.round(sec / 3600)));
          document.getElementById("licUnit").value = "3600";
        }
      });
    });

    document.getElementById("licMake").addEventListener("click", async () => {
      const note = document.getElementById("licNote").value.trim();
      const seconds = selectedLicenseSeconds();
      const until = document.getElementById("licUntil");
      const out = document.getElementById("licOut");
      const wrap = document.getElementById("licOutWrap");
      until.textContent = "יוצר רישיון…";
      wrap.hidden = true;
      try {
        const issued = await createLicense(note, seconds);
        out.value = issued.license_key;
        wrap.hidden = false;
        const exp = issued.expires_at
          ? Math.floor(Date.parse(issued.expires_at) / 1000)
          : nowSec() + seconds;
        until.textContent = Number.isFinite(exp)
          ? `${formatRemaining(exp)} · עד ${formatUntil(exp)}`
          : "";
      } catch (error) {
        until.textContent = error?.message || "לא הצלחנו ליצור רישיון";
      }
    });

    async function repairSession(session) {
      if (session.role !== "user" || !session.license) return session;
      const left = (session.licenseExp || session.exp) - nowSec();
      if (left <= 400 * 86400) return session;
      try {
        const pwf = await verifyPwfLicense(session.license, session.email || "");
        if (!pwf.ok) return session;
        const exp = parsePwfExp(pwf.key);
        return { ...session, exp, licenseExp: exp };
      } catch {
        return session;
      }
    }

    const existing = readSession();
    if (existing) {
      unlockApp(existing);
      repairSession(existing).then((session) => {
        writeSession(session);
        refreshExpiry(session);
      });
    }

    const installBtn = document.getElementById("installBtn");
    const installDlg = document.getElementById("installDlg");
    const standaloneMedia = window.matchMedia("(display-mode: standalone)");
    let deferredPrompt;

    function isInstalledApp() {
      return standaloneMedia.matches || window.navigator.standalone === true;
    }

    function syncInstallButton() {
      installBtn.hidden = isInstalledApp();
    }

    syncInstallButton();
    standaloneMedia.addEventListener("change", syncInstallButton);

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      syncInstallButton();
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = undefined;
    });

    installBtn.addEventListener("click", () => {
      if (isInstalledApp()) {
        syncInstallButton();
        return;
      }
      installDlg.showModal();
    });
    document.getElementById("installNo").addEventListener("click", () => {
      installDlg.close();
    });
    document.getElementById("installYes").addEventListener("click", async () => {
      installDlg.close();
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = undefined;
    });

    document.getElementById("iosHint")?.remove();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=42").then((reg) => reg.update()).catch(() => {});
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
