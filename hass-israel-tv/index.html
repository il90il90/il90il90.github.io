<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Israel TV — צפייה ישירה</title>
  <meta name="description" content="צפייה ישירה בערוצי ישראל — ספורט 1–4, קשת 12, ערוץ 14 ועוד." />
  <meta name="theme-color" content="#070b12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Israel TV" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --bg-soft: #0e1520;
      --card: #151d2b;
      --card-hover: #1d283a;
      --line: #243044;
      --text: #eef3f8;
      --muted: #93a0b3;
      --accent: #3d8bff;
      --accent-2: #f5c451;
      --live: #ff4d4d;
      --ok: #3dd68c;
      --radius: 16px;
      --header: 64px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "Segoe UI", "Rubik", "Arial Hebrew", Arial, sans-serif;
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    header.top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: var(--header);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      background: rgba(7, 11, 18, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: max-content; }
    .brand img { width: 36px; height: 36px; border-radius: 10px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
    .brand span { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
    .install {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .install[hidden] { display: none !important; }
    .ios-hint {
      display: none;
      margin: 0 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #1a2740;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }
    .ios-hint.show { display: block; }

    .search {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: inherit;
      padding: 0 16px;
      font-size: 16px;
    }
    .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 0; }

    .theater {
      position: relative;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .theater video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: min(62vh, 720px);
      background: #000;
    }
    .idle, .status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }
    .idle { background: radial-gradient(circle at 50% 20%, #1a2740 0%, #070b12 70%); }
    .idle strong { font-size: 22px; }
    .idle p, .status p { margin: 0; color: var(--muted); }
    .status { background: rgba(0, 0, 0, 0.45); }
    .status.hidden, .idle.hidden { display: none; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--live); box-shadow: 0 0 0 6px rgba(255, 77, 77, 0.15);
    }

    .now {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 12px 14px;
      background: var(--bg-soft);
      border-top: 1px solid var(--line);
    }
    .now .name { font-weight: 700; }
    .now .en { color: var(--muted); font-size: 13px; }
    .now .live {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 77, 77, 0.12); color: #ff8a8a;
      border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700;
    }
    .actions { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button, .actions a {
      border: 0; border-radius: 10px; padding: 8px 12px;
      background: #243044; color: var(--text); text-decoration: none;
      cursor: pointer; font-size: 13px;
    }
    .actions button.primary { background: var(--accent); color: #fff; }

    .section { margin-top: 22px; }
    .section[hidden] { display: none !important; }
    .section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 650;
    }

    .chips, .cats { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .cat {
      border: 1px solid var(--line);
      background: var(--card);
      color: inherit;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip:hover, .cat:hover, .card:hover { background: var(--card-hover); }
    .chip.active, .cat.active { background: var(--accent); border-color: transparent; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
    }
    .card {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: inherit;
      border-radius: var(--radius);
      padding: 12px 10px 14px;
      cursor: pointer;
      text-align: center;
      min-width: 0;
    }
    .card.active { outline: 2px solid var(--accent); }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 10px;
      border-radius: 16px; background: #0b1018;
      display: grid; place-items: center; overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .card .title { font-weight: 700; font-size: 14px; line-height: 1.3; }
    .card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    footer.credit {
      margin: 36px 16px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      direction: ltr;
    }
    footer.credit a { color: inherit; font-weight: 700; }

    @media (max-width: 720px) {
      header.top {
        flex-wrap: wrap;
        gap: 8px;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
      }
      .brand h1 { font-size: 16px; }
      .search { width: 100%; flex-basis: 100%; }
      .count { display: none; }
      .install { margin-inline-start: auto; }
      main { padding: 12px 12px 0; }
      .theater {
        position: sticky;
        top: calc(var(--header) + env(safe-area-inset-top, 0px));
        z-index: 15;
        border-radius: 14px;
      }
      .theater video { max-height: 36vh; }
      .now { padding: 10px 10px; gap: 8px; }
      .now .en { display: none; }
      .actions { width: 100%; }
      .actions button, .actions a { flex: 1; text-align: center; min-height: 40px; }
      .chips, .cats {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      .chip, .cat { flex: 0 0 auto; min-height: 40px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .logo { width: 52px; height: 52px; border-radius: 12px; }
      .card { padding: 10px 6px 12px; }
      .card .title { font-size: 13px; }
      .idle strong { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="favicon.png" alt="" />
      <div>
        <h1>Israel TV</h1>
        <span>צפייה ישירה</span>
      </div>
    </div>
    <button type="button" class="install" id="installBtn">התקן אפליקציה</button>
    <input class="search" id="q" type="search" placeholder="חיפוש: ספורט 4, קשת, 12, 14..." enterkeyhint="search" />
    <div class="count" id="count"></div>
  </header>
  <p class="ios-hint" id="iosHint">באייפון: לחצו <b>שתף</b> למטה ואז <b>הוסף למסך הבית</b>. באנדרואיד: התפריט ⋮ ואז <b>הוסף למסך הבית</b>.</p>

  <main>
    <section class="theater" id="theater">
      <video id="player" controls playsinline></video>
      <div class="idle" id="idle">
        <div class="dot"></div>
        <strong>בחרו ערוץ והשידור מתחיל כאן</strong>
        <p>ספורט 1–4, קשת 12, ערוץ 14 וכל הקטלוג</p>
      </div>
      <div class="status hidden" id="status"><p></p></div>
    </section>

    <div class="now">
      <span class="live" id="live" hidden><span class="dot"></span> LIVE</span>
      <span class="name" id="nowName">אין ערוץ נבחר</span>
      <span class="en" id="nowEn"></span>
      <div class="actions">
        <button type="button" class="primary" id="playBtn">נגן</button>
        <button type="button" id="copyBtn">העתק קישור</button>
        <a id="openBtn" href="#" target="_blank" rel="noopener">פתח בחלון</a>
      </div>
    </div>

    <section class="section" id="recentSection" hidden>
      <h2>נפתח לאחרונה</h2>
      <div class="chips" id="recent"></div>
    </section>

    <section class="section">
      <h2>קטגוריות</h2>
      <div class="cats" id="cats"></div>
    </section>

    <section class="section">
      <h2 id="gridTitle">כל הערוצים</h2>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="credit">
    Made with ♥️ From&nbsp;<a href="https://t.me/israelCohen" target="_blank" rel="noopener">Israel</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
  <script type="module">
    import { CHANNELS, CATEGORY_LABELS } from "./channels.js";

    const BROADPEAK_KEY = "0123456789ABCDEF0123456789ABCDEF";
    const DEFAULT_CTI = "50629300e9872d0a6c94a48089a07763";
    const CDN = "stm-hpc-ory-1a.cellcomtvcdn.tv";
    const RECENT_KEY = "israel-tv-recent";
    const RECENT_LIMIT = 12;

    const ALIASES = {
      "1": "yes1", "ספורט 1": "yes1",
      "2": "yes2", "ספורט 2": "yes2",
      "3": "yes3", "ספורט 3": "yes3",
      "4": "yes4", "ספורט 4": "yes4",
      "5": "sport_5",
      "6": "sport_6",
      "9": "ch9",
      "11": "kan11", "כאן": "kan11",
      "12": "keshet_12", "קשת": "keshet_12",
      "13": "reshet_13", "רשת": "reshet_13",
      "14": "ch14",
    };

    const video = document.getElementById("player");
    const idle = document.getElementById("idle");
    const status = document.getElementById("status");
    const live = document.getElementById("live");
    const nowName = document.getElementById("nowName");
    const nowEn = document.getElementById("nowEn");
    const openBtn = document.getElementById("openBtn");
    const recentSection = document.getElementById("recentSection");
    const recentEl = document.getElementById("recent");
    const catsEl = document.getElementById("cats");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const gridTitle = document.getElementById("gridTitle");

    let hls;
    let current;
    let currentUrl = "";
    let category = "all";

    function b64url(bytes) {
      let bin = "";
      const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function b64urlJson(obj) {
      return b64url(new TextEncoder().encode(JSON.stringify(obj)));
    }

    async function hmacSha256(keyStr, dataStr) {
      const key = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(keyStr),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(dataStr));
      return b64url(sig);
    }

    async function generateBroadpeakJwt() {
      const header = { alg: "HS256", kid: "broadpeak", typ: "JWT" };
      const payload = { cti: DEFAULT_CTI, exp: 2000000000.0 };
      const h = b64urlJson(header);
      const p = b64urlJson(payload);
      return `${h}.${p}.${await hmacSha256(BROADPEAK_KEY, `${h}.${p}`)}`;
    }

    async function buildCatUrl(path) {
      const jwt = await generateBroadpeakJwt();
      return `https://${CDN}/_cat/${jwt}/${path.replace(/^\/+/, "")}`;
    }

    function setStatus(text) {
      if (!text) {
        status.classList.add("hidden");
        status.querySelector("p").textContent = "";
        return;
      }
      status.classList.remove("hidden");
      status.querySelector("p").textContent = text;
    }

    function matches(channel, query) {
      if (!query) return true;
      if (ALIASES[query] === channel.id) return true;
      const hay = `${channel.id} ${channel.name} ${channel.nameEn} ${channel.label}`.toLowerCase();
      return hay.includes(query);
    }

    function loadRecent() {
      try {
        const ids = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
        return Array.isArray(ids) ? ids.filter((id) => CHANNELS.some((channel) => channel.id === id)) : [];
      } catch {
        return [];
      }
    }

    function saveRecent(id) {
      const ids = loadRecent().filter((item) => item !== id);
      ids.unshift(id);
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids.slice(0, RECENT_LIMIT)));
    }

    function visibleChannels() {
      const query = document.getElementById("q").value.trim().toLowerCase();
      return CHANNELS.filter((channel) => {
        if (category !== "all" && channel.category !== category) return false;
        return matches(channel, query);
      });
    }

    function render() {
      const query = document.getElementById("q").value.trim().toLowerCase();
      recentEl.innerHTML = "";
      const recent = loadRecent()
        .map((id) => CHANNELS.find((item) => item.id === id))
        .filter((channel) => channel && matches(channel, query));
      recentSection.hidden = recent.length === 0;
      for (const channel of recent) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chip${current?.id === channel.id ? " active" : ""}`;
        btn.textContent = channel.name;
        btn.addEventListener("click", () => playChannel(channel));
        recentEl.append(btn);
      }

      catsEl.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = `cat${category === "all" ? " active" : ""}`;
      allBtn.textContent = "הכל";
      allBtn.addEventListener("click", () => { category = "all"; render(); });
      catsEl.append(allBtn);
      for (const [id, label] of Object.entries(CATEGORY_LABELS)) {
        if (!CHANNELS.some((channel) => channel.category === id)) continue;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `cat${category === id ? " active" : ""}`;
        btn.textContent = label;
        btn.addEventListener("click", () => { category = id; render(); });
        catsEl.append(btn);
      }

      const list = visibleChannels();
      gridEl.innerHTML = "";
      for (const channel of list) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `card${current?.id === channel.id ? " active" : ""}`;
        card.innerHTML = `
          <div class="logo">${channel.logo ? `<img src="${channel.logo}" alt="">` : channel.name.slice(0, 2)}</div>
          <div class="title"></div>
          <div class="sub"></div>
        `;
        card.querySelector(".title").textContent = channel.name;
        card.querySelector(".sub").textContent = channel.nameEn;
        card.addEventListener("click", () => playChannel(channel));
        gridEl.append(card);
      }

      countEl.textContent = `${list.length} ערוצים`;
      gridTitle.textContent = query || category !== "all"
        ? `${list.length} ערוצים`
        : `כל הערוצים (${CHANNELS.length})`;
    }

    function attachHls(url) {
      if (hls) {
        hls.destroy();
        hls = undefined;
      }
      video.removeAttribute("src");
      if (video.canPlayType("application/vnd.apple.mpegurl") && !window.Hls?.isSupported()) {
        video.src = url;
        return video.play().catch(() => {});
      }
      if (window.Hls?.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("");
          video.play().catch(() => setStatus("לחצו נגן כדי להתחיל עם שמע"));
        });
        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data?.fatal) setStatus("השידור לא נטען. נסו ערוץ אחר או העתיקו את הקישור ל-VLC.");
        });
        return;
      }
      setStatus("הדפדפן לא תומך ב-HLS. העתיקו את הקישור ל-VLC.");
    }

    async function playChannel(channel) {
      current = channel;
      saveRecent(channel.id);
      idle.classList.add("hidden");
      live.hidden = false;
      nowName.textContent = channel.name;
      nowEn.textContent = channel.nameEn;
      setStatus("טוען שידור…");
      history.replaceState(null, "", `#${channel.id}`);
      render();
      try {
        currentUrl = await buildCatUrl(channel.path);
        openBtn.href = currentUrl;
        attachHls(currentUrl);
      } catch (error) {
        setStatus("לא ניתן לחתום את הקישור בדפדפן הזה.");
      }
    }

    document.getElementById("q").addEventListener("input", render);
    document.getElementById("playBtn").addEventListener("click", () => {
      if (!current) {
        const lastId = loadRecent()[0] || "yes4";
        const fallback = CHANNELS.find((channel) => channel.id === lastId);
        if (fallback) playChannel(fallback);
        return;
      }
      video.play().catch(() => {});
      setStatus("");
    });
    document.getElementById("copyBtn").addEventListener("click", async () => {
      if (!currentUrl) {
        const lastId = loadRecent()[0] || "yes4";
        const fallback = CHANNELS.find((channel) => channel.id === lastId);
        if (fallback) await playChannel(fallback);
      }
      if (currentUrl) {
        await navigator.clipboard.writeText(currentUrl);
      }
    });

    render();

    const startId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    const start = CHANNELS.find((channel) => channel.id === startId)
      || (startId && CHANNELS.find((channel) => ALIASES[startId] === channel.id));
    if (start) playChannel(start);

    const installBtn = document.getElementById("installBtn");
    const iosHint = document.getElementById("iosHint");
    const standalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
    let deferredPrompt;

    if (standalone) {
      installBtn.hidden = true;
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = undefined;
        installBtn.hidden = true;
        return;
      }
      iosHint.classList.toggle("show");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
